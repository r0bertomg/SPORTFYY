<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <a class="logo" href="index.html"><span class="logo-icone"><span></span><span></span><span></span></span>Cadastro</a>
        <div class="painel">
            <h1>Cadastre-se</h1>
            <div id="mensagem" class="mensagem"></div>
            <form id="formulario">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Nome completo" required>
                </div>
                <div class="linha">
                    <div class="campo">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" min="0" max="130" placeholder="Ex: 25" required>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" data-cpf inputmode="numeric" placeholder="000.000.000-00" required>
                    </div>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" minlength="4" placeholder="Mínimo 4 caracteres" required>
                </div>
                <div class="campo">
                    <label for="confirmar">Confirmar senha</label>
                    <input type="password" id="confirmar" placeholder="Repita a senha" required>
                </div>
                <button type="submit">Cadastrar</button>
            </form>
            <div class="rodape-form">
                Já tem conta? <a href="index.html">Entrar</a>
            </div>
        </div>
    </div>
    <script src="utils.js"></script>
    <script src="cadastro.js"></script>
</body>
</html>
