<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth">
        <a class="logo" href="index.html"><span class="logo-icone"><span></span><span></span><span></span></span>Cadastro</a>
        <div class="painel">
            <h1>Entrar</h1>
            <div id="mensagem" class="mensagem"></div>
            <form id="formulario">
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" data-cpf inputmode="numeric" placeholder="000.000.000-00" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Senha" required>
                </div>
                <button type="submit">Entrar</button>
            </form>
            <div class="rodape-form">
                Não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </div>
        </div>
    </div>
    <script src="utils.js"></script>
    <script src="login.js"></script>
</body>
</html>
